<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover + user-scalable=no are critical for edge-to-edge Android PWA -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- Android Chrome theme / status bar color -->
  <meta name="theme-color" content="#3b82f6" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Android Chrome "Add to Home Screen" -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS Support (also used on some Android browsers) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Oasis" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Description for install prompt -->
  <meta name="description"
    content="Encuentra fuentes de agua potable cerca de ti. Para corredores, ciclistas y senderistas." />

  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <title>Oasis 💧 Fuentes de Agua</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
